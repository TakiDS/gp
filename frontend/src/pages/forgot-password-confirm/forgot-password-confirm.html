<style>
  @keyframes page-in {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  @keyframes card-rise {
    from {
      opacity: 0;
      transform: scale(0.94) translateY(24px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  @keyframes icon-pop {
    0% {
      opacity: 0;
      transform: scale(0.5) rotate(-12deg);
    }
    65% {
      transform: scale(1.12) rotate(3deg);
      opacity: 1;
    }
    100% {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }
  }
  @keyframes slide-up {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes fade-in {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  @keyframes bar-fill {
    from {
      transform: scaleX(0.5);
      transform-origin: left;
    }
    to {
      transform: scaleX(1);
      transform-origin: left;
    }
  }

  .anim-page {
    animation: page-in 0.3s ease both;
  }
  .anim-card {
    animation: card-rise 0.5s cubic-bezier(0.22, 0.68, 0, 1.2) both 60ms;
  }
  .anim-icon {
    animation: icon-pop 0.6s cubic-bezier(0.22, 0.68, 0, 1.2) both 180ms;
  }
  .anim-step {
    animation: slide-up 0.4s cubic-bezier(0.22, 0.68, 0, 1.2) both 290ms;
  }
  .anim-bar {
    animation: bar-fill 0.65s cubic-bezier(0.22, 0.68, 0, 1.2) both 400ms;
  }
  .anim-title {
    animation: slide-up 0.4s cubic-bezier(0.22, 0.68, 0, 1.2) both 360ms;
  }
  .anim-divider {
    animation: fade-in 0.4s ease both 430ms;
  }
  .anim-body-1 {
    animation: slide-up 0.4s cubic-bezier(0.22, 0.68, 0, 1.2) both 490ms;
  }
  .anim-body-2 {
    animation: slide-up 0.4s cubic-bezier(0.22, 0.68, 0, 1.2) both 560ms;
  }
  .anim-pill {
    animation: slide-up 0.4s cubic-bezier(0.22, 0.68, 0, 1.2) both 620ms;
  }
  .anim-btn {
    animation: slide-up 0.4s cubic-bezier(0.22, 0.68, 0, 1.2) both 690ms;
  }
  .anim-footer {
    animation: fade-in 0.4s ease both 780ms;
  }
</style>

<div
  class="anim-page min-h-screen w-full flex items-center justify-center bg-background text-foreground transition-colors duration-300 px-4 py-10"
>
  <div
    class="anim-card relative bg-card text-card-foreground border border-border rounded-3xl p-8 sm:p-10 md:p-12 flex flex-col items-center w-full max-w-[460px] shadow-xl"
  >
    <div class="flex items-center justify-center mb-6 w-16 h-16 rounded-full bg-[#3aa982]/10">
      <svg
        class="anim-icon w-9 h-9 text-[#3aa982]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>

    <div class="flex flex-col items-center gap-2 mb-8 w-full anim-step">
      <p class="text-xs text-muted-foreground font-semibold">
        Etapa <span class="text-foreground font-bold">2</span> de 2
      </p>
      <div class="w-28 h-1.5 bg-muted rounded-full overflow-hidden">
        <div class="anim-bar h-full w-full bg-[#3aa982] rounded-full"></div>
      </div>
    </div>

    <h1
      class="anim-title text-xl sm:text-2xl font-bold text-foreground tracking-tight text-center mb-2"
    >
      E-mail enviado com sucesso!
    </h1>

    <div class="anim-divider w-full my-5">
      <div class="h-px w-full bg-border rounded-full"></div>
    </div>

    <div class="flex flex-col items-center gap-3 text-center mb-6 w-full">
      <p class="anim-body-1 text-sm sm:text-base font-bold text-foreground leading-snug">
        Enviamos um link para redefinir sua senha.
      </p>
      <p class="anim-body-2 text-sm text-muted-foreground leading-relaxed max-w-[320px]">
        Não encontrou? Verifique sua
        <span class="font-bold text-foreground/80">caixa de entrada</span> ou a pasta de
        <span class="font-bold text-foreground/80">spam</span>.
      </p>

      @if (email) {
        <div
          class="anim-pill mt-1 flex items-center gap-2 bg-muted/60 border border-border rounded-full px-4 py-1.5"
        >
          <svg
            class="w-3.5 h-3.5 text-muted-foreground shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <span class="text-xs font-semibold text-muted-foreground truncate max-w-[220px]">{{
            email
          }}</span>
        </div>
      }
    </div>

    <a
      routerLink="/login"
      class="anim-btn group w-full flex items-center justify-center gap-2 h-12 rounded-xl bg-[#212D6B] text-white text-sm font-bold tracking-wide transition-all duration-200 hover:bg-[#1a2458] hover:-translate-y-0.5 active:scale-[0.98] active:translate-y-0"
    >
      <span>Voltar para o login</span>
      <svg
        class="w-4 h-4 transition-transform group-hover:translate-x-1"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h14M12 5l7 7-7 7" />
      </svg>
    </a>

    <p class="anim-footer mt-6 text-center text-xs text-muted-foreground leading-relaxed">
      Não recebeu o e-mail após alguns minutos?
      <button
        routerLink="/forgot-password"
        class="text-primary font-bold hover:underline underline-offset-4 ml-1 transition-colors bg-transparent border-none cursor-pointer"
      >
        Tentar novamente
      </button>
    </p>
  </div>
</div>
