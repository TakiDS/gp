<style>
  @keyframes scale-in {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(16px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  @keyframes slide-from-top {
    from {
      opacity: 0;
      transform: translateY(-18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes fade-up {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes fade-in {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  @keyframes progress-grow {
    from {
      transform: scaleX(0);
      transform-origin: left;
    }
    to {
      transform: scaleX(1);
      transform-origin: left;
    }
  }

  .anim-card {
    animation: scale-in 0.55s cubic-bezier(0.22, 0.68, 0, 1.2) both;
  }
  .anim-title {
    animation: slide-from-top 0.5s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 100ms;
  }
  .anim-step {
    animation: slide-from-top 0.5s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 160ms;
  }
  .anim-progress {
    animation: fade-in 0.4s ease both;
    animation-delay: 220ms;
  }
  .anim-progress-bar {
    animation: progress-grow 0.6s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 400ms;
  }
  .anim-field {
    animation: fade-up 0.45s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 300ms;
  }
  .anim-btn {
    animation: fade-up 0.45s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 390ms;
  }
  .anim-divider {
    animation: fade-in 0.4s ease both;
    animation-delay: 470ms;
  }
  .anim-footer {
    animation: fade-up 0.4s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 520ms;
  }
</style>

<!-- Modal de loading (sobrepõe tudo enquanto isSending = true) -->
@if (isSending()) {
  <z-forgot-password-sending-modal />
}

<div
  class="min-h-screen w-full flex items-center justify-center bg-background text-foreground transition-colors duration-300"
>
  <div
    class="bg-card text-card-foreground border border-border rounded-3xl p-10 md:p-12 flex flex-col items-center w-full max-w-[480px] shadow-2xl relative overflow-hidden anim-card"
  >
    <div class="flex flex-col gap-3 items-center justify-center text-center mb-10">
      <h3 class="text-2xl font-bold tracking-tight anim-title">Redefina sua senha</h3>

      <p class="text-sm text-muted-foreground font-medium anim-step">
        Etapa <span class="text-foreground font-bold">1</span> de 2: E-mail cadastrado
      </p>

      <div class="w-32 h-1.5 bg-muted rounded-full mt-2 overflow-hidden anim-progress">
        <div
          class="h-full w-1/2 bg-primary rounded-full shadow-[0_0_8px_rgba(var(--primary),0.4)] anim-progress-bar"
        ></div>
      </div>
    </div>

    <form class="flex flex-col gap-8 w-full" (submit)="$event.preventDefault()">
      <div class="flex flex-col gap-2 anim-field">
        <label
          class="text-[10px] uppercase font-black tracking-[0.15em] text-muted-foreground ml-1"
          for="email"
        >
          Email corporativo
        </label>
        <input
          [(ngModel)]="emailModel"
          name="email"
          id="email"
          z-input
          type="email"
          placeholder="exemplo@giap.com.br"
          class="h-12 w-full rounded-xl p-4 bg-background border border-input text-sm outline-none transition-all focus:ring-4 focus:ring-primary/10 focus:border-primary placeholder:text-muted-foreground/50"
        />
      </div>

      <button
        (click)="enviarCodigo()"
        [disabled]="isSending()"
        class="relative group w-full h-12 mt-6 flex gap-2 items-center justify-center overflow-hidden rounded-xl bg-[#212D6B] text-white font-bold tracking-wide shadow-[0_10px_20px_-10px_rgba(33,45,107,0.6)] transition-all duration-300 hover:shadow-[0_15px_30px_-10px_rgba(33,45,107,0.5)] hover:-translate-y-0.5 active:scale-[0.98] active:translate-y-0 disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed anim-btn"
      >
        <span class="relative z-10">Enviar código de recuperação</span>
        <lucide-angular
          [img]="ArrowRight"
          size="18"
          strokeWidth="3"
          class="relative z-10 transition-transform group-hover:translate-x-1"
        ></lucide-angular>
        <div
          class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"
        ></div>
      </button>
    </form>

    <div class="flex items-center gap-4 w-full my-8 anim-divider">
      <div class="h-px flex-1 bg-border/60"></div>
    </div>

    <p class="text-center text-sm text-muted-foreground font-medium anim-footer">
      Já possui uma conta?
      <a
        href="/login"
        class="text-primary font-bold hover:underline underline-offset-4 ml-1 transition-colors"
      >
        Fazer Login
      </a>
    </p>
  </div>
</div>
