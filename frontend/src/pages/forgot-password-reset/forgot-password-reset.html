<style>
  @keyframes scale-in {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(16px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  @keyframes fade-down {
    from {
      opacity: 0;
      transform: translateY(-14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes fade-up {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes fade-in {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .anim-btn-theme {
    animation: fade-in 0.4s ease both;
    animation-delay: 0ms;
  }
  .anim-card {
    animation: scale-in 0.55s cubic-bezier(0.22, 0.68, 0, 1.2) both;
  }
  .anim-logo {
    animation: fade-down 0.5s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 80ms;
  }
  .anim-title {
    animation: fade-down 0.5s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 140ms;
  }
  .anim-field-1 {
    animation: fade-up 0.45s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 210ms;
  }
  .anim-field-2 {
    animation: fade-up 0.45s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 280ms;
  }
  .anim-btn {
    animation: fade-up 0.45s cubic-bezier(0.22, 0.68, 0, 1.2) both;
    animation-delay: 350ms;
  }
  .anim-footer {
    animation: fade-in 0.4s ease both;
    animation-delay: 430ms;
  }
</style>

<main
  class="relative min-h-[100dvh] bg-background text-foreground flex items-center justify-center px-4 transition-colors duration-500 selection:bg-primary/30"
>
  <div class="absolute top-6 right-6 z-50 anim-btn-theme">
    <button
      z-button
      zType="ghost"
      zSize="sm"
      (click)="toggleTheme()"
      class="text-muted-foreground hover:text-foreground hover:bg-accent rounded-sm transition-all duration-300 border border-border backdrop-blur-md"
    >
      <z-icon zType="dark-mode" class="size-4.5" />
      <span class="sr-only">Toggle theme</span>
    </button>
  </div>

  <div class="absolute inset-0 bg-primary/5 blur-[120px] pointer-events-none"></div>

  <div class="w-full max-w-[440px] relative z-10">
    <div
      class="rounded-3xl bg-card text-card-foreground p-8 md:p-12 border border-border shadow-xl transition-all duration-500 anim-card"
    >
      <header class="flex flex-col items-center gap-4 text-center mb-10">
        <div class="anim-logo">
          <img class="h-12 block dark:hidden" src="/assets/giap-logo.svg" alt="GIAP Logo" />
          <img class="h-12 hidden dark:block" src="/assets/giap-logo-white.svg" alt="GIAP Logo" />
        </div>
        <div class="mt-2 anim-title">
          <h1 class="text-2xl font-bold tracking-tight">Definir Nova Senha</h1>
          <p class="text-muted-foreground text-sm mt-2">Crie uma senha forte para sua conta</p>
        </div>
      </header>

      <form class="space-y-6" (submit)="$event.preventDefault()">
        <div class="space-y-2 anim-field-1">
          <label
            for="senha"
            class="text-[11px] font-black uppercase tracking-[0.15em] text-muted-foreground ml-1"
          >
            Nova Senha
          </label>
          <div class="relative group">
            <input
              [(ngModel)]="senhaModel"
              name="senha"
              id="senha"
              [type]="mostrarSenha ? 'text' : 'password'"
              placeholder="No mínimo 8 caracteres"
              class="w-full h-12 px-4 pr-11 bg-muted/30 border border-input rounded-md text-sm text-foreground selection:bg-selection-color placeholder:text-muted-foreground/50 outline-none transition-all focus:ring-4 focus:ring-primary/10 focus:border-primary"
            />
            <button
              type="button"
              (click)="mostrarSenha = !mostrarSenha"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors p-1 rounded"
              [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
            >
              <lucide-angular [img]="mostrarSenha ? EyeOff : Eye" size="18"></lucide-angular>
            </button>
          </div>
        </div>

        <div class="space-y-2 anim-field-2">
          <label
            for="confirmarSenha"
            class="text-[11px] font-black uppercase tracking-[0.15em] text-muted-foreground ml-1"
          >
            Confirmar Senha
          </label>
          <div class="relative group">
            <input
              [(ngModel)]="confirmarSenhaModel"
              name="confirmarSenha"
              id="confirmarSenha"
              [type]="mostrarConfirmar ? 'text' : 'password'"
              placeholder="Repita a senha escolhida"
              class="w-full h-12 px-4 pr-11 bg-muted/30 border border-input rounded-md text-sm text-foreground selection:bg-selection-color placeholder:text-muted-foreground/50 outline-none transition-all focus:ring-4 focus:ring-primary/10 focus:border-primary"
            />
            <button
              type="button"
              (click)="mostrarConfirmar = !mostrarConfirmar"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors p-1 rounded"
              [attr.aria-label]="mostrarConfirmar ? 'Ocultar senha' : 'Mostrar senha'"
            >
              <lucide-angular [img]="mostrarConfirmar ? EyeOff : Eye" size="18"></lucide-angular>
            </button>
          </div>
        </div>

        <button
          (click)="definirNovaSenha()"
          type="button"
          class="relative group w-full h-12 mt-2 flex items-center justify-center overflow-hidden rounded-xl bg-brand-color text-white font-bold tracking-wide shadow-[0_10px_20px_-10px_rgba(33,45,107,0.6)] transition-all duration-300 hover:shadow-[0_15px_30px_-10px_rgba(33,45,107,0.5)] hover:-translate-y-0.5 active:scale-[0.98] active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed anim-btn"
        >
          <span class="relative z-10 flex items-center gap-2">
            Redefinir Senha
            <lucide-angular
              [img]="ArrowRight"
              size="18"
              class="transition-transform duration-300 group-hover:translate-x-1"
            ></lucide-angular>
          </span>
          <div
            class="absolute inset-0 bg-gradient-to-b from-white/5 to-black/5 opacity-0 group-hover:opacity-100 transition-opacity"
          ></div>
        </button>
      </form>

      <footer class="mt-10 pt-8 border-t border-border/50 text-center anim-footer">
        <p class="text-[11px] text-muted-foreground font-medium tracking-wide">
          © {{ currentYear }} GIAP · Segurança e Controle
        </p>
      </footer>
    </div>
  </div>
</main>
