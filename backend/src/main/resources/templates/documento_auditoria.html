<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auditoria de Patrimônio</title>
    <style>
        /* Estilos focados em impressão/PDF */
        body {
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            font-size: 14px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 18px;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        /* Tabela de Cabeçalho */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .info-table td {
            border: 1px solid #000;
            padding: 8px;
            width: 50%;
        }
        /* Títulos das Categorias */
        h3 {
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 10px;
            background-color: #dddddd;
            padding: 5px;
            border: 1px solid #000;
        }
        /* Tabelas de Itens */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 50px;
            table-layout: auto; /* Mude de fixed para auto */
        }
        .data-table th, .data-table td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        .data-table th {
            background-color: #f1f1f1;
            font-weight: bold;
        }
        .col-item { width: 5%; text-align: center; }
        .col-patrimonio { width: 15%; }
        .col-descricao { 
            width: 45%; 
            word-wrap: break-word; 
            word-break: normal;
        }
        .col-estado { width: 15%; }
        .col-check { width: 10%; }

        thead {
            /* display: table-header-group; */
            display: table-row-group;
        }

        /* 2. Impede que o conteúdo dentro de uma linha (tr) seja cortado ao meio */
        tr {
            page-break-inside: avoid !important;
            -fs-keep-with-inline: keep;
        }

        td {
            page-break-inside: avoid !important;
            vertical-align: top; /* Garante que o texto comece sempre no topo da célula */
            word-wrap: break-word;
        }

        /* 3. Evita que o título da categoria fique sozinho no fim da página (o "órfão") */
        h3 {
            page-break-after: avoid;
            margin-top: 15px;
        }

        /* 4. Melhora a renderização geral das tabelas para PDF */
        table {
            border-spacing: 0;
            -fs-table-paginate: paginate;
        }

        .categoria-group {
            page-break-inside: auto !important; 
        }

        .categoria-group h3 {
            page-break-after: avoid !important;
        }

        .categoria-group table {
            page-break-before: avoid !important;
        }

        /* Rodapé de Assinatura */
        .footer {
            margin-top: 40px;
            page-break-inside: avoid; /* Evita que a assinatura quebre pela metade em 2 páginas */
        }
        .observacoes {
            margin-bottom: 40px;
        }
        .observacoes p {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .box-obs {
            border: 1px solid #000;
            height: 80px;
            width: 99%;
        }
        .assinatura-area {
            text-align: center;
            margin-top: 50px;
        }
        .linha-assinatura {
            border-top: 1px solid #000;
            width: 60%;
            margin: 0 auto;
            padding-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WEB ACADEMY - AUDITORIA DE PATRIMÔNIO</h1>

        <table class="info-table">
            <tr>
                <td><strong>Local:</strong> <span th:text="${dados.local}">Laboratório</span></td>
                <td><strong>Total de itens:</strong> <span th:text="${dados.totalPatrimonio}">0</span></td>
            </tr>
            <tr>
                <td><strong>Auditor:</strong> ___________________________________</td>
                <td><strong>Data:</strong> <span th:text="${dados.dataAuditoria}">15/03/2026</span></td>
            </tr>
        </table>

        <div th:each="entry : ${dados.patrimoniosPorCategoria}" class="categoria-group" style="page-break-inside: auto;">
            <h3 th:text="'Categoria: ' + ${entry.key}">Categoria: Nome</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-item">Item</th>
                        <th class="col-patrimonio">Patrimônio</th>
                        <th class="col-descricao">Descrição</th>
                        <th class="col-estado">Estado</th>
                        <th class="col-check">Check</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, stat : ${entry.value}">
                        <td class="col-item" th:text="${stat.count}"></td>
                        <td class="col-patrimonio" th:text="${item.numPatrimonio}"></td>
                        <td class="col-descricao" 
                            style="word-break: break-word; overflow-wrap: break-word;" 
                            th:text="${item.patrimonioGeral?.descricao}"></td>
                        <td class="col-estado" th:text="${item.estado}"></td>
                        <td class="col-check"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <div class="observacoes">
                <p>Observações Gerais:</p>
                <div class="box-obs"></div>
            </div>

            <div class="assinatura-area">
                <div class="linha-assinatura">Assinatura do Auditor</div>
            </div>
        </div>
    </div>

</body>
</html>
