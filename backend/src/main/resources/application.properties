spring.application.name=back-end

#### Prefixo Etiqueta ###
patrimonio.prefixo=WBA

#### Configuração do Banco de Dados ###
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sgp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#### Cloudinary ###
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

### Url base ###
app.base-url=${FRONTEND_URL:http://localhost:4200}

#### Upload de Arquivos ###
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#### Segurança ###
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
api.security.token.expiration-minutes=180
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.data-encryption-key=${DATA_ENCRYPTION_KEY_BASE64}

#### Bootstrap inicial de administrador (desabilitado por padrão) ###
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrador do Sistema}

#### E-mail ###
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Dados sensíveis protegidos por variáveis
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.h2.console.enabled=false
spring.main.allow-circular-references=true

#### Integração Frontend ###
api.frontend.url=${FRONTEND_URL:http://localhost:4200}

#### Retorno da assinatura do termo pro back ###
api.backend.url=${BACKEND_URL:http://localhost:8080}

### API DA IA ###
gemini.key=${API_SECRET_GEMINI}
danfe.api.url=${DANFE_API_URL:}

#### immudb ###
immudb.host=${IMMUDB_HOST:localhost}
immudb.port=${IMMUDB_PORT:3322}
immudb.database=${IMMUDB_DATABASE:defaultdb}
immudb.username=${IMMUDB_USERNAME:immudb}
immudb.password=${IMMUDB_PASSWORD}

## Para de reclamar java
net.sf.jasperreports.awt.ignore.missing.font=true
net.sf.jasperreports.default.font.name=SansSerif

# Configurações da SEFAZ
# Se a variável de ambiente existir (Docker), usa ela. Se não, usa o caminho do Windows (Local)
sefaz.certificado.caminho=${CAMINHO_CERTIFICADO:src/main/resources/certificados/certificado_fundape.pfx}
sefaz.certificado.senha=${SENHA_CERTIFICADO:}
sefaz.schemas.caminho=${CAMINHO_SCHEMAS:src/main/resources/schemas}
